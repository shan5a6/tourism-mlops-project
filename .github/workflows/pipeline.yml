name: Tourism Project Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'tourism_project/data/**'
      - 'tourism_project/model_building/**'
      - 'tourism_project/requirements.txt'
      - '.github/workflows/pipeline.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-mlops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data_registration:
    name: 1 - Data Registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Validate source dataset
        run: python tourism_project/model_building/data_register.py

  data_preparation:
    name: 2 - Data Preparation
    runs-on: ubuntu-latest
    needs: data_registration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Split data and store CSVs
        run: python tourism_project/model_building/prep.py
      - name: Upload prepared data for training job
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: tourism_project/artifacts/*.csv
          if-no-files-found: error

  model_training:
    name: 3 - Model Training, Tracking and Commit
    runs-on: ubuntu-latest
    needs: data_preparation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download train/test workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: tourism_project/artifacts
      - name: Train, tune, track with MLflow and evaluate
        run: python tourism_project/model_building/train.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Upload run reports and model for audit
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-and-model
          path: |
            tourism_project/artifacts/classification_report.txt
            tourism_project/artifacts/confusion_matrix.json
            tourism_project/artifacts/grid_search_results.csv
            tourism_project/deployment/model.joblib
            tourism_project/deployment/feature_schema.json
            tourism_project/deployment/metrics.json
          if-no-files-found: error
      - name: Upload MLflow experiment history
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-experiments
          path: tourism_project/mlruns/
          if-no-files-found: error
      - name: Commit latest model to main branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tourism_project/deployment/model.joblib tourism_project/deployment/feature_schema.json tourism_project/deployment/metrics.json
          if git diff --cached --quiet; then
            echo 'Model artifacts unchanged; nothing to commit.'
          else
            git commit -m 'chore: update trained tourism model [skip ci]'
            git push origin HEAD:main
          fi
